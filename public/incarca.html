<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Încărcare Materiale</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a2b4c">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8f9fa; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #1a2b4c; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #4a5568; font-size: 14px;}
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background-color: #2b6cb0; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #2c5282; }
        .mesaj { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>⬆️ Încarcă un Material Nou</h2>
        <form id="formUpload">
            <div class="form-group"><label>Titlu material:</label><input type="text" name="titlu" required placeholder="Ex: Curs 01 - Pointeri"></div>
            <div class="form-group"><label>Ciclu:</label><select name="ciclu"><option value="Licenta">Licență</option><option value="Master">Master</option></select></div>
            <div class="form-group"><label>Anul:</label><select name="anul"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
            <div class="form-group"><label>Semestrul:</label><select name="semestru"><option value="Semestrul 1">Semestrul 1</option><option value="Semestrul 2">Semestrul 2</option></select></div>
            <div class="form-group"><label>Materia:</label><input type="text" name="materia" required placeholder="Ex: Programare Competitiva"></div>
            <div class="form-group"><label>Tip material:</label><select name="tip_material"><option value="Curs">Curs</option><option value="Seminar">Seminar</option><option value="Laborator">Laborator</option></select></div>
            <div class="form-group"><label>An Universitar:</label><input type="text" name="an_universitar" required placeholder="Ex: 2026-2027"></div>
            <div class="form-group"><label>Fișier PDF:</label><input type="file" name="fisier_pdf" accept=".pdf" required></div>
            <div class="form-group"><label>Parolă Administrator:</label><input type="password" name="parola" required placeholder="Introdu parola (uaic2026)"></div>
            
            <button type="submit">ÎNTRĂRCĂ FIȘIERUL</button>
        </form>
        <div id="statusMesaj" class="mesaj"></div>
    </div>

    <script>
        document.getElementById('formUpload').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formDate = new FormData(e.target);
            const mesajEl = document.getElementById('statusMesaj');
            
            mesajEl.style.color = '#d69e2e';
            mesajEl.innerText = 'Se încarcă... te rugăm să aștepți.';

            try {
                const response = await fetch('/api/incarca', { method: 'POST', body: formDate });
                const rezultat = await response.text();
                
                if (response.ok) {
                    mesajEl.style.color = 'green';
                    mesajEl.innerText = '✅ Materialul a fost adăugat cu succes!';
                    e.target.reset(); // Curățăm formularul
                } else {
                    mesajEl.style.color = 'red';
                    mesajEl.innerText = '❌ ' + rezultat;
                }
            } catch (err) {
                mesajEl.style.color = 'red';
                mesajEl.innerText = '❌ Eroare de rețea!';
            }
        });
    if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('PWA activat cu succes!'))
        .catch(err => console.error('Eroare PWA:', err));
    });
  }
    </script>
</body>
</html>

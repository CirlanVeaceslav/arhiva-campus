<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arhiva Campus UAIC</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a2b4c">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .locatie { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; background-color: #f9f9f9; }
        .nume { font-size: 18px; font-weight: bold; color: #0056b3; }
        .detalii { color: #555; font-size: 14px; margin-top: 5px; display: inline-block;}
        .scor { color: #00ff00; display: inline-block;}
    </style>
</head>
<body>
    <h1>Locatii pentru Studenti</h1>
    <p>Top locații și cantine recomandate:</p>
    
    <div id="lista-locatii">Se încarcă datele...</div>

    <script>
        async function incarcaLocatii() {
            try {
                // Facem o cerere către propria noastră rută API
                const response = await fetch('/api/locatii');
                const locatii = await response.json();
                
                const container = document.getElementById('lista-locatii');
                container.innerHTML = ''; // Curățăm textul de încărcare

                // Parcurgem fiecare locație și o adăugăm pe pagină
                locatii.forEach(locatie => {
                    const div = document.createElement('div');
                    div.className = 'locatie';
                    div.innerHTML = `
                        <div class="nume">${locatie.nume}</div>
                        <div class="detalii">Categorie: ${locatie.categorie}/10</div><div class="scor">Scor: ${locatie.scor}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                document.getElementById('lista-locatii').innerText = 'Eroare la conectarea cu baza de date.';
            }
        }

        // Apelăm funcția când se deschide pagina
        incarcaLocatii();
    if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('PWA activat cu succes!'))
        .catch(err => console.error('Eroare PWA:', err));
    });
  }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platforma Campus UAIC</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a2b4c">
    <style>
    body { 
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        text-align: center; 
        padding: 5vh 20px; 
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        margin: 0;
    }
    h1 { color: #1a2b4c; font-size: 2.5rem; margin-bottom: 10px; }
    p { color: #4a5568; margin-bottom: 40px; font-size: 1.1rem; }
    .meniu-container { 
        display: flex; flex-direction: column; gap: 20px; 
        max-width: 450px; margin: 0 auto; 
    }
    .buton-meniu {
        display: block; padding: 20px 25px; font-size: 1.1rem; font-weight: 600;
        color: #fff; background-color: #2b6cb0; text-decoration: none;
        border-radius: 12px; box-shadow: 0 4px 15px rgba(43, 108, 176, 0.2); 
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        text-align: left;
    }
    .buton-meniu:hover { 
        background-color: #2c5282; 
        transform: translateY(-4px);
        box-shadow: 0 8px 25px rgba(43, 108, 176, 0.3);
    }
</style>
    </style>
</head>
<body>
    <h1>Platforma Arhiva Campus UAIC</h1>
    <p>Alege categoria pe care dorești să o explorezi:</p>

    <div class="meniu-container">
        <!-- Aceste pagini vor fi create pe parcurs -->
        <a href="/materiale.html" class="buton-meniu">📚 Arhiva Materiale (Cursuri, Seminare)</a>
        
        <!-- Aceasta este pagina pe care tocmai am redenumit-o -->
        <a href="/locatii.html" class="buton-meniu">☕ Locații, Cantine și Cafenele</a>
        
        <a href="/preturi.html" class="buton-meniu">💰 Comparator Prețuri Cămin</a>
    </div>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('PWA activat cu succes!'))
        .catch(err => console.error('Eroare PWA:', err));
    });
  }
</script>
</body>
</html>
